spring:
  application:
    name: api-gateway

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/gatewaydb}

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:my-local-dev-secret-key-change-in-prod}
  expiry-ms: 900000

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

logging:
  level:
    com.github.sreyash.api_gateway: DEBUG
    org.springframework.security: INFO