spring:
  application:
    name: api-gateway

  datasource:
    url: jdbc:h2:mem:gatewaydb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:my-local-dev-secret-key-change-in-prod}
  expiry-ms: 900000

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

logging:
  level:
    com.github.sreyash.api_gateway: DEBUG
    org.springframework.security: INFO