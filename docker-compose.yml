services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  api-gateway:
    build: .
    ports:
      - "8080:8080"
    environment:
      - JWT_SECRET=${JWT_SECRET:-local-dev-secret-change-in-prod}
      - MONGODB_URI=mongodb://mongo:27017/gatewaydb
    depends_on:
      - mongo
    restart: unless-stopped

volumes:
  mongo-data: